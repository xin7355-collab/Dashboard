name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  # 每日快照 commit 完之後自動重新部署。
  workflow_run:
    workflows: ['每日儲存空間快照']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 沒有建置步驟：整個站台就是原生的 HTML 與 ES module。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
