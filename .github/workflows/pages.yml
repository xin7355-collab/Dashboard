name: 部署 GitHub Pages

on:
  # 不寫死分支名：改用下面 job 層級的判斷，比對 repo 當下的預設分支。
  # 寫死 main 的話，預設分支叫別的名字時這個 workflow 永遠不會觸發。
  push:
  # 每日快照 commit 完之後自動重新部署。
  workflow_run:
    workflows: ['每日儲存空間快照']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 只從預設分支部署；其他分支的 push 直接跳過。
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 沒有建置步驟：整個站台就是原生的 HTML 與 ES module。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
